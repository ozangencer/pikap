# Copy to ~/.config/pikap/config.toml

# Client ID of your own Spotify Developer app (https://developer.spotify.com/dashboard).
client_id = "your-client-id"

# Must be registered on that app exactly as written here.
redirect_uri = "http://127.0.0.1:8989/login"

# Spotify's personal playlists (Discover Weekly, Daily Mixes, Release Radar) cannot be
# listed through the Web API. Paste their share links to see them in the library.
made_for_you = [
    # "https://open.spotify.com/playlist/37i9dQZEVXcXXXXXXXXXXX",
]
