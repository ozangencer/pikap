name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build a universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output pikap \
            target/aarch64-apple-darwin/release/pikap \
            target/x86_64-apple-darwin/release/pikap
          codesign --force --sign - pikap
          ./pikap --version
          asset="pikap-${GITHUB_REF_NAME}-macos.tar.gz"
          tar -czf "$asset" pikap LICENSE README.md
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
            --title "pikap ${GITHUB_REF_NAME#v}" --generate-notes
